# 测试环境的覆盖项。
#
# 【为什么必须有这个文件】
# `@SpringBootTest` 会**真的执行启动钩子**，而知识库的启动钩子会在后台扫目录、调嵌入 API、写向量库。
# 实测踩过：跑一次 `mvn test` 就往 Milvus 里灌了 29 块，还花了嵌入的 token ——
# 这违反宪法 §5「单测不得依赖真实外部环境」，也让测试不再可重复。
# 所以这里把「启动时扫描」关掉；**生产环境没有这个文件**，走 application.yml 的 true。
agent.kb.scan-on-startup=false

# 再关掉 MCP 的启动发现。
# 原因同上：`McpToolset` 在 Bean 构造期就会去连 MCP 服务器（默认是高德），
# 单测一旦联网就既慢又不可重复，还可能因为密钥/网络状况时红时绿。
# MCP 客户端本身的逻辑用「桩服务器」单测，不依赖这一项。
agent.mcp.enabled=false
