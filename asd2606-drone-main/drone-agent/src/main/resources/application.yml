server:
  port: 8081

spring:
  application:
    name: drone-agent

# 大模型接入配置。
# api-key 从环境变量 DEEPSEEK_API_KEY 读取，不落在配置文件里。
# 没配 key 时服务能正常启动，只是调用 /chat 会返回「未配置」的提示。
agent:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    reasoning-effort: high
    thinking-enabled: true
    # 系统提示词**不在这里** —— 已迁到 src/main/resources/prompts/assistant/system.md，
    # 由 PromptCatalog 在启动时加载并校验（见 docs/sdd/specs/REQ-AGENT-0008-提示词工程化管理.md）。
    # 改措辞改那个 md 文件即可，重启生效；写坏了（空正文/名字与路径不符/变量对不上）服务直接起不来。
  internal:
    # drone-server 的地址，本服务向它取用户的角色与权限
    base-url: ${DRONE_SERVER_URL:http://localhost:8080}
    # 共享密钥，必须与 drone-server 的 drone.internal.token 一致
    token: ${DRONE_INTERNAL_TOKEN:drone-dev-internal-token-change-me}
    # 调内部接口的超时
    timeout-ms: 3000
    # RBAC 数据缓存秒数：越小权限变更生效越快，越大对 drone-server 压力越小。
    # 这是本服务唯一引入的「权限延迟」——drone-server 那边改权限是立即生效的
    cache-seconds: 60
  # 记忆子系统。注意：开启后本服务**不再是无状态**的，且只允许单实例部署
  # （内存态会话与本地文件都无法跨实例共享，见 docs/sdd/decisions/ADR-0003）。
  memory:
    # 长期记忆落盘根目录。**部署时必须挂卷**，否则容器重建即丢全部长期记忆。
    # 放在 data/ 下是有意的：该目录已在 .gitignore 覆盖范围内，不会被误提交。
    root: ${AGENT_MEMORY_ROOT:./data/agent-memory}
    # 内存中同时保留的会话数上限。超出时最久未访问的会话先落盘、再被驱逐
    session-max-count: 500
    # 会话空闲多久算结束。到期时先落盘再移除，所以用户下次回来还记得
    idle-timeout: 30m
    # 单个会话在内存里保留的消息条数上限。超出则整体落盘后驱逐
    # ——刻意不截断：截断会丢掉中间内容，与「长期记忆保留原文」的初衷冲突
    max-messages-per-session: 200
    # 单个正文文件的大小上限，超过就滚动到下一个文件（memory-YYYY-MM-DD-2.md）
    file-max-bytes: 2MB
    # 注入模型的长期记忆预算。存的是原文，所以这两个值直接决定每次请求的 token 成本；
    # 超出部分从最早处截断（近期内容比远期更有用）
    inject-max-turns: 10
    inject-max-chars: 8000
    # 是否**每轮无条件注入**其他会话的长期记忆（REQ-AGENT-0021 起默认关闭）。
    # 关闭后改为模型按需调用 search_memory 检索；下面两个预算只在开启时生效。
    # 想回滚旧行为：把这里改成 true。
    inject-enabled: false
    # 会话内压缩（REQ-AGENT-0020）：长会话不再只保留最近 20 条、把更早的丢掉，
    # 而是把「除最近 10 条以外」的部分压成一段摘要注入。
    # 触发要求「未摘要条数 > trigger」，所以默认每攒 20 条触发一次。
    compact-trigger-messages: 30
    compact-keep-messages: 10
    # 摘要长度上限与送去摘要的原文上限（摘要调用本身也要花 token）
    compact-summary-chars: 1500
    compact-input-chars: 12000
  # MCP（Model Context Protocol）接入。见 docs/sdd/specs/REQ-AGENT-0011-MCP工具接入.md
  # 启动时会逐个连服务器、列出工具，并**自动注册**成模型可调用的工具（名字：别名__远程名）。
  # 加第二个 MCP Server 只需往 servers 里加一项，不用改代码。
  mcp:
    # 总开关。关掉即回到「只有本地工具」的状态
    enabled: true
    # 发现失败（连不上 / 超时 / 返回坏数据）时是否让服务启动失败。
    # false = 记 WARN 并跳过该服务器——地图服务故障不应该拖垮整个助手
    fail-fast: false
    # 所有服务器发现的总时间预算。避免一个黑洞地址把启动拖成几十秒
    startup-budget: 8s
    # 每个服务器的发现尝试次数（含首次）。用于容忍「agent 先起、MCP 服务晚几秒就绪」：
    # 3 次 + 2s 间隔，意味着对方在 ~4s 内起来都能被发现，不需要重启 agent
    discovery-attempts: 3
    discovery-retry-delay: 2s
    # 打印 MCP 的**原始请求体与响应体**（排障用）。
    # 注意：报文里含业务数据；生产建议 false。Authorization 请求头任何情况下都不会打印。
    log-raw-payload: ${MCP_LOG_RAW_PAYLOAD:true}
    servers:
      - # 工具名前缀会是 amap__maps_weather 这种形式，别名必须唯一
        alias: amap
        # 密钥只在环境变量里配（AMAP_MCP_KEY）。留空时该服务器会被跳过并记 WARN，
        # 服务照常启动——这是刻意设计：本地开发不配 key 也能跑
        url: https://mcp.amap.com/mcp?key=${AMAP_MCP_KEY:}
        enabled: true
        connect-timeout: 5s
        # 必须小于 agent.tool.invoke-timeout（15s），否则日志里只能看到编排层超时
        request-timeout: 8s
        headers: {}
        # 工具白名单（远程原名）。**留空 = 全部暴露**，这里刻意留空：
        # 需求方要求高德的工具全部可用。exclude 优先于 include，需要临时屏蔽某个工具时写在 exclude 里。
        # 代价：高德当前 15 个工具的描述都会进每轮 prompt（约 1.5k tokens），
        # 工具越多，模型选错的概率与成本都上升；后续如需收敛，往 include 里加名字即可。
        include: []
        exclude: []
        # 这批工具都是只读查询，允许与本地只读工具并发执行
        parallel-safe: true
        # 高德是第三方服务：**不转发用户 Token**
        forward-authorization: false
      - # 平台业务工具（drone-mcp-server），工具名前缀是 drone__
        alias: drone
        # 独立服务，默认只绑回环；部署换地址时用环境变量覆盖
        url: ${DRONE_MCP_URL:http://127.0.0.1:8082/mcp}
        enabled: true
        connect-timeout: 3s
        # 必须 < agent.tool.invoke-timeout(15s)；MCP 服务自身调上游是 10s
        request-timeout: 12s
        headers: {}
        # 空 = 暴露 drone-mcp-server 的全部工具（当前 70 个）
        include: []
        exclude: []
        # 含写操作，不能与其他工具并发执行
        parallel-safe: false
        # 关键：把当前用户的 JWT 转发过去，权限与审计落到真人
        forward-authorization: true
  # 任务路由（REQ-AGENT-0033）：按用户问题在 ReAct / Plan / SubAgent 之间选择；
  # 关掉后退回“显式先给方案 / 内置计划 / ReAct”的旧逻辑。
  route:
    enabled: true
  # 子 Agent 预算（REQ-AGENT-0033）：单次子 Agent 自身上限 + 启动前剩余额度下限。
  subagent:
    max-prompt-tokens: 30000
    min-remaining-tokens: 15000
  # Plan 模式（REQ-AGENT-0031）：
  # 内置固定流程严格按 resources/plans/*.json 执行、不审批；
  # 运行时生成的计划必须先展示给用户、批准后执行。
  plan:
    enabled: true
    # 生成计划的落盘目录；空字符串表示只存内存
    root: ${AGENT_PLAN_ROOT:./data/plans}
    # 生成计划的有效期（等待用户批准）
    ttl: 30m
    # 计划内只读步骤的并发上限
    parallel: 4
  # 工具调用（本地工具 + MCP 工具）。见 docs/sdd/specs/REQ-AGENT-0004-工具调用.md
  tool:
    # 总开关。关掉即回到「只会聊天」的纯对话（上线可灰度 / 回滚用）
    enabled: true
    # 一次对话最多几轮「模型要工具」的循环；超了就不再给工具，逼模型基于已有结果收尾。
    # 从 3 提到 8：标准化流程（日报要查 5 个接口 + 读模板/口径）实测会用到 7–8 轮工具调用；
    # 轮次不够时工具被半路收回，模型会输出伪工具文本（DSML）。
    max-rounds: 8
    # 是否允许把本轮多个「只读」工具并发执行；关掉即逐个执行（与之前一致）
    parallel-enabled: true
    # 并发执行时的线程数上限
    concurrency: 4
    # 单个工具的执行超时（编排层兜底，与工具自身的客户端超时是两道闸）
    invoke-timeout: 15s
    # 编排优化（REQ-AGENT-0007）总开关。关掉即回到 0005 的行为（下面的预算与「重试/压缩」一并失效）
    optimize-enabled: true
    # 单次工具回填的字符上限（optimize-enabled=false 时用旧值 4000）
    max-result-chars: 2000
    # 一次对话里所有工具结果的字符总量上限；超出的结果不回填、只留省略标记
    max-total-result-chars: 6000
    # Skill 资源（use_skill / read_skill_resource）的**独立预算**（REQ-AGENT-0019）。
    # 它们不走上面的通用压缩（模板被压缩/摘要会毁掉占位符与样式），但必须有上限：
    # 单次 32768 与 skill.max-resource-chars 对齐；累计 30000 足够一次完整日报
    # （正文 5.5KB + 模板 12.3KB + 口径 2.4KB ≈ 20KB），最坏约 1.5 万 token。
    # 超限时只硬截断并带标记，不调模型摘要。
    max-skill-result-chars: 32768
    max-total-skill-chars: 30000
    # 工具「失败」后允许的重试次数
    max-retries: 1
    # 待确认票据（REQ-AGENT-0029）：落盘后重启仍可确认；TTL 到期自动清理。
    # 设为空字符串可退回「只存内存」。
    pending-root: ${AGENT_PENDING_ROOT:./data/pending}
    pending-ttl: 5m
    # 写操作台账（REQ-AGENT-0029）：operationId / 工具 / 状态 / 对象 ID，供取消报告与补偿追溯。
    operation-root: ${AGENT_OPERATION_ROOT:./data/operations}
    # 危险工具清单（REQ-AGENT-0006）：命中则**每次执行前都要人工确认**。
    # 这里只收「删除 / 授权 / 状态翻转 / 拒绝撤回 / 报告修订」这类不可逆或高影响操作；
    # 创建、派发、打卡、完成等常规操作交给 drone-server 的 RBAC 判定即可。
    dangerous:
      - drone__zone_delete
      - drone__route_delete
      - drone__point_delete
      - drone__user_toggle
      - drone__system_role_save
      - drone__system_role_grant
      - drone__system_user_grant
      - drone__task_withdraw
      - drone__task_refuse
      # 该接口没有权限注解，靠服务内「task:list 或任务本人」判断，风险更高
      - drone__task_report_revise
    # 角色 → 允许使用的工具。危险工具**必须**在这里显式授予角色，否则谁都不可用（fail-closed）。
    # 上面这些工具都只授予管理员；需要下放时再往对应角色里加。
    role-tools:
      admin:
        - drone__zone_delete
        - drone__route_delete
        - drone__point_delete
        - drone__user_toggle
        - drone__system_role_save
        - drone__system_role_grant
        - drone__system_user_grant
        - drone__task_withdraw
        - drone__task_refuse
        - drone__task_report_revise
    # 工具可见性（REQ-AGENT-0018）：模式 → 需要的权限码（任一满足即可见）。
    # 按声明顺序**先匹配先用**；未匹配任何规则的工具默认可见（地图、知识检索、Skill 元工具）。
    # 它只决定「下发给模型的工具定义」，执行前仍会再判一次角色与权限。
    # 权限码以 drone-server 的 permission 表为准；改这里不用改代码。
    visible-by:
      # —— 员工 / 用户：user_me 谁都能看，必须排在 user_* 前面 ——
      - pattern: "drone__user_me"
        any-of: []
      - pattern: "drone__user_add"
        any-of: [staff:add]
      - pattern: "drone__user_update"
        any-of: [staff:edit]
      - pattern: "drone__user_toggle"
        any-of: [staff:toggle]
      - pattern: "drone__user_*"
        any-of: [staff:list]
      # —— 系统 / RBAC ——
      - pattern: "drone__system_role_save"
        any-of: [system:role:save]
      - pattern: "drone__system_role_grant"
        any-of: [system:role:grant]
      - pattern: "drone__system_user_grant"
        any-of: [system:user:grant]
      - pattern: "drone__system_*"
        any-of: [system:rbac:list]
      # —— 任务：写操作先按动作匹配，读操作兜底给 list/execute ——
      - pattern: "drone__task_create"
        any-of: [task:add]
      - pattern: "drone__task_dispatch"
        any-of: [task:dispatch]
      - pattern: "drone__task_dispatch_options"
        any-of: [task:dispatch]
      - pattern: "drone__task_withdraw"
        any-of: [task:cancel, task:dispatch]
      - pattern: "drone__task_refuse"
        any-of: [task:cancel, task:dispatch]
      - pattern: "drone__task_start"
        any-of: [task:execute]
      - pattern: "drone__task_finish"
        any-of: [task:execute]
      - pattern: "drone__task_fail"
        any-of: [task:execute]
      - pattern: "drone__task_checkin"
        any-of: [task:execute]
      - pattern: "drone__task_alert_report"
        any-of: [task:execute]
      - pattern: "drone__task_my*"
        any-of: [task:execute]
      - pattern: "drone__task_*"
        any-of: [task:list, task:execute]
      # —— 告警 ——
      - pattern: "drone__alert_handle"
        any-of: [alert:handle]
      - pattern: "drone__alert_*"
        any-of: [alert:list, alert:handle]
      # —— 设备 ——
      - pattern: "drone__device_add"
        any-of: [device:add]
      - pattern: "drone__device_update"
        any-of: [device:edit]
      - pattern: "drone__device_*"
        any-of: [device:list, device:detail]
      # —— 点位 / 航线：写操作要 edit，读操作 list 即可 ——
      - pattern: "drone__point_add"
        any-of: [route:edit]
      - pattern: "drone__point_update"
        any-of: [route:edit]
      - pattern: "drone__point_delete"
        any-of: [route:edit]
      - pattern: "drone__point_*"
        any-of: [route:list, route:edit]
      - pattern: "drone__route_add"
        any-of: [route:edit]
      - pattern: "drone__route_update"
        any-of: [route:edit]
      - pattern: "drone__route_delete"
        any-of: [route:edit]
      - pattern: "drone__route_*"
        any-of: [route:list, route:edit]
      # —— 禁飞区：同上 ——
      - pattern: "drone__zone_add"
        any-of: [zone:edit]
      - pattern: "drone__zone_update"
        any-of: [zone:edit]
      - pattern: "drone__zone_delete"
        any-of: [zone:edit]
      - pattern: "drone__zone_toggle"
        any-of: [zone:edit]
      - pattern: "drone__zone_*"
        any-of: [zone:list, zone:edit]
      # —— 统计 / 大屏：运营视角，飞手（只有 task:execute）看不到 ——
      - pattern: "drone__analytics_*"
        any-of: [task:list, staff:list, alert:list]
      - pattern: "drone__dashboard_*"
        any-of: [task:list, staff:list, alert:list]
    # 本地工具的元数据（名字、描述、参数、能否并行）。代码里的本地工具只提供**行为**，按 name 与这里对齐。
    # 改描述/参数不必改代码，重启即生效。对不上（重名 / 缺一边）会让服务启动失败。
    # 注意：**MCP 远程工具不写在这里**——它们的名字、描述与参数都来自服务端 tools/list，
    # 由 McpToolset 在启动时自动注册（见 docs/sdd/specs/REQ-AGENT-0011-MCP工具接入.md）。
    catalog:
      - name: search_knowledge
        read-only: true
        description: 检索内部资料（如无人机操作手册、保险方案）。回答内部流程、规范、制度类问题时用它；不要凭记忆编造内部资料内容。
        parallel-safe: true
        # 入参的 JSON Schema。**必须写成 JSON 字符串**，不能写成结构化的 yml：
        # Spring 把 yml 里嵌套的数组绑进 Map<String,Object> 时会变成「以 0、1 为键的对象」
        # （required: [query] → {"0":"query"}），模型会回 400 Invalid schema。
        parameters-json: |-
          {
            "type": "object",
            "properties": {
              "query": { "type": "string", "description": "检索用的关键词或一句话问题" }
            },
            "required": ["query"]
          }
      # 长期记忆检索（REQ-AGENT-0021）：只在用户提到过去对话时调用，只读自己的归档正文。
      # 取代「每轮无条件注入最近 10 轮」——固定成本几乎归零，删除会话后也查不到。
      - name: search_memory
        read-only: true
        description: 检索当前用户过去会话的长期记忆（历史对话原文摘录）。当用户提到「上次/之前/我跟你说过/我的…」或需要历史决定、任务号时使用；只返回该用户自己的记忆。
        parallel-safe: true
        parameters-json: |-
          {
            "type": "object",
            "properties": {
              "query": { "type": "string", "description": "检索关键词或一句话，如任务号、设备编号、人名" }
            },
            "required": ["query"]
          }
      # 业务流程 Skill（REQ-AGENT-0014）：先 use_skill 取完整步骤，再按步骤调业务工具。
      # 两个工具的元数据必须在这里（与行为 1:1），即使 skill 目录为空也保留。
      - name: use_skill
        read-only: true
        description: 加载一个标准化业务流程（Skill）的完整步骤。遇到运营日报、派发前检查、告警分诊、交接班等固定流程时，先用它取步骤再执行。
        parallel-safe: true
        parameters-json: |-
          {
            "type": "object",
            "properties": {
              "name": { "type": "string", "description": "流程名，如 daily-operations-report" }
            },
            "required": ["name"]
          }
      - name: read_skill_resource
        read-only: true
        description: 按需读取某条业务流程的参考资料（references/ 下的文件）。只在 use_skill 的正文提示需要核对口径时调用。
        parallel-safe: true
        parameters-json: |-
          {
            "type": "object",
            "properties": {
              "skill": { "type": "string", "description": "流程名" },
              "path": { "type": "string", "description": "如 references/metric-definitions.md" }
            },
            "required": ["skill", "path"]
          }
  # 上下文账单（REQ-AGENT-0025）：每次模型调用落一条 JSONL，供面板展示与管理端汇总。
  # 只存 token / 工具名 / 时间，不存对话正文；data/ 已在 .gitignore 覆盖范围内。
  bill:
    enabled: true
    root: ${AGENT_BILL_ROOT:./data/bills}
    retention-days: 30
  # 请求限流（REQ-AGENT-0030）：每用户 + 全局的 QPS 与并发；单实例内存。
  # 超限直接拒绝，不调模型、不占会话锁；分布式部署需网关或 Redis。
  rate-limit:
    enabled: true
    user-qps: 2
    user-burst: 4
    user-concurrency: 2
    global-qps: 20
    global-burst: 40
    global-concurrency: 20
  # 预算执行（REQ-AGENT-0028）：超限拦截需要账单数据；bill.enabled=false 时预算自动失效。
  # 日额度超限直接拒绝新请求；单请求超限停止工具循环并收尾。
  budget:
    enabled: true
    max-request-tokens: 60000
    max-daily-tokens-per-user: 1500000
  # 链路追踪（REQ-AGENT-0026）。按 {root}/{userId}/{traceId}.jsonl 落盘 span。
  trace:
    enabled: true
    root: ${AGENT_TRACE_ROOT:./data/traces}
    ttl: 7d
  # HTML 产物（日报等）。见 docs/sdd/specs/REQ-AGENT-0015-HTML产物预览与下载.md
  artifact:
    # 按 {root}/{userId}/ 分目录，归属即权限边界；data/ 已被 .gitignore 覆盖
    root: ${AGENT_ARTIFACT_ROOT:./data/artifacts}
    # 单文件上限；超过视为「不是产物」，不抽取、回复原样返回
    max-bytes: 524288
    # 保留时长；启动与写入时清理过期文件
    ttl: 7d
  # 业务流程 Skill（REQ-AGENT-0014）。见 docs/sdd/specs/REQ-AGENT-0014-业务流程Skill.md
  skill:
    # 总开关。关闭后目录为空，use_skill 返回「暂无」；两个工具仍在（注册表要求成对）
    enabled: true
    # 单条流程正文上限。细节（口径、字段表）请放 references/，按需读取
    max-body-chars: 8000
    # 单次读取参考资料的上限，超出截断并标注
    max-resource-chars: 32768
  # 内部资料检索（RAG）。见 docs/sdd/specs/REQ-AGENT-0010-内部资料检索.md
  kb:
    # 总开关。关掉即回到「不检索任何内部资料」的纯对话（可灰度 / 回滚）
    enabled: true
    # 启动后是否在后台扫一次资料目录（生产要开，否则新放的资料不入库）。
    # 测试环境由 src/test/resources/application.properties 关掉——否则 @SpringBootTest
    # 会真的去调嵌入服务、写向量库。
    scan-on-startup: true
    # 知识库原料目录。放内部资料（当前只支持 Markdown）。
    # 与记忆同理：运行时按需创建，部署应挂卷；该目录在 .gitignore 覆盖范围内（data/），不会被误提交。
    directory: ${AGENT_KB_ROOT:./data/knowledge}
    # 检索返回的条数上限
    top-k: 5
    # 相似度下限：低于它的结果不返回（0 表示不过滤）。
    # 实测（GLM embedding-3，2026-10-16）：相关问题的最高分 ≈ 0.53，**库里没有的内容**也能拿到 ≈ 0.46；
    # 0 会让「查不到」永不发生（什么都返回 5 条）。取 0.5 能把两者分开。
    # 样本很小，**后续应基于更大的评估集再调**。
    min-score: 0.5
    # 可见范围：**在配置里按路径声明，原始资料一个字都不用改**（资料格式五花八门，不能要求它们带头信息）。
    # 规则**先命中先用**；都没命中走 default-perms；default-perms 也为空则该资料**无人可见**（fail-closed）。
    # 例：
    #   perm-rules:
    #     - path: "财务/**"            # 相对知识库目录的路径模式（glob）
    #       perms: [agent:finance]
    #     - path: "**/*.pdf"
    #       perms: [agent:chat]
    # 当前知识库目录下的两份资料都走 default-perms（谁能用助手谁就能查）。
    # 想试「按资料拆分权限」：把下面那条规则取消注释，保险方案就只对 agent:finance 可见
    # （届时用 agent:chat 的账号问保险，应当**查不到**——而不是查到后不说）。
    perm-rules:
      # - path: "**/无人机保险方案.md"
      #   perms: [agent:finance]
    default-perms: [agent:chat]
    # 切块：单块最大字符数 + 相邻块重叠字符数（避免关键句被切在边界上、两边都不完整）
    chunk:
      max-chars: 800
      overlap-chars: 100
    # 嵌入模型：走 embedding API（见 ADR-0006 决策 5）。
    # 供应商与模型名走配置，代码里不写死；api-key 只从环境变量读，不落配置文件。
    # 默认给我们的 GLM（智谱）：api-key 仍只从**环境变量**读，不落配置文件。
    # 换别家：设 EMBEDDING_BASE_URL / EMBEDDING_API_KEY / EMBEDDING_MODEL 覆盖即可。
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      api-key: ${EMBEDDING_API_KEY:${ZHIPU_API_KEY:}}
      model: ${EMBEDDING_MODEL:embedding-3}
      # 向量维度：**必须与所用模型一致**，否则写进 Milvus 会被拒。
      # 实测：智谱 GLM `embedding-3` 默认输出 2048 维（可用 EMBEDDING_DIMENSION 覆盖）。
      dimension: ${EMBEDDING_DIMENSION:2048}
    # 向量库：自托管 Milvus（Docker 单机，见 ADR-0006）。走 **REST API**（HTTP）。
    # 实测（Milvus v2.5.8）：REST 的 `/v2/vectordb/**` 与 gRPC 共用 **19530**；
    # 9091 只是 management/metrics 端口（只有 /healthz 等），别连错。
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      # 集合名：沿用环境里原有的 drone_knowledge（plans §4 定的），**不要**再写成草稿名 kb_chunks
      collection: drone_knowledge

# JWT 配置。节点名与 drone-server 完全一致，因此两个服务的 yml 可以直接对照。
# secret 与 issuer 都必须与 drone-server 相同，否则 drone-server 签发的 Token 在这里验签会失败。
drone:
  jwt:
    secret: ${JWT_SECRET:drone-dev-secret-key-please-change-in-production-2026}
    issuer: drone-server

logging:
  level:
    cn.tedu.droneagent: debug
